# Quality gate del JRPG
#
# Se ejecuta:
#   - en cada push a "desarrollo" (aviso temprano mientras trabajas)
#   - en cada pull request hacia "calidad" o "master" (el gate de verdad)
#   - a mano, desde la pestaña Actions de GitHub (workflow_dispatch)
#
# Repo privado + GitHub Free: no se puede BLOQUEAR el merge, la regla la pones tú:
# no se fusiona nada en rojo.

name: Quality gate

on:
  push:
    branches: [desarrollo]
  pull_request:
    branches: [calidad, master]
  workflow_dispatch:

jobs:
  # 1. ¿Compila? Con MSVC en Windows, como en local
  compilar:
    name: Compilar (Windows / MSVC)
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Caché de dependencias (SDL3, SDL3_image)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configurar con CMake
        run: cmake -S . -B build

      - name: Compilar
        run: cmake --build build --config Debug --target jrpg

  # 2. Análisis estático con cppcheck
  analisis:
    name: Análisis estático (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Sugerencias de rendimiento/portabilidad: se muestran, pero NO hacen fallar el gate
      - name: cppcheck - sugerencias (informativo)
        run: >
          cppcheck src
          --std=c++20 --language=c++
          --enable=performance,portability
          --inline-suppr
          --suppress=missingIncludeSystem --suppress=missingInclude
          --template="{file}:{line}: [{severity}] {message} ({id})"

      # Errores y avisos (bugs probables): si aparece alguno, el gate falla
      - name: cppcheck - errores y avisos (bloqueante)
        run: >
          cppcheck src
          --std=c++20 --language=c++
          --enable=warning
          --error-exitcode=1
          --inline-suppr
          --suppress=missingIncludeSystem --suppress=missingInclude
          --template="{file}:{line}: [{severity}] {message} ({id})"
